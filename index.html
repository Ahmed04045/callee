<!doctype html>
<html lang="en" data-theme="electric" data-style="plain">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Circosodal: find clubs, events and gigs for students in Qatar. Join private university clubs, RSVP to events and start your own." />

    <!-- Apply the saved theme before first paint so there is no flash of the wrong palette. -->
    <script>
      try {
        var t = localStorage.getItem('circosodal.theme');
        if (t && ['electric', 'ultraviolet', 'acid', 'paper'].indexOf(t) > -1) {
          document.documentElement.setAttribute('data-theme', t);
        }
        var st = localStorage.getItem('circosodal.style');
        if (st === 'pixel') {
          document.documentElement.setAttribute('data-style', 'pixel');
        }
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter (body), Space Grotesk (headings), JetBrains Mono (small labels) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <!-- Plain style: Material Symbols icons are loaded on demand by src/theme/theme.js. Pixel style: Pixelarticons, bundled from npm (src/main.jsx). -->

    <title>Circosodal | Clubs, events and gigs for students in Qatar</title>
    <link rel="canonical" href="https://callee-sooty.vercel.app/" />
    <meta name="theme-color" content="#04060F" />

    <!-- Link previews (WhatsApp, Discord, X, Facebook). Add an og:image (1200x630) once you have one. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Circosodal" />
    <meta property="og:title" content="Circosodal | Clubs, events and gigs for students in Qatar" />
    <meta property="og:description" content="Find events, join private university clubs and discover gigs. Built for students in Qatar." />
    <meta property="og:url" content="https://callee-sooty.vercel.app/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Circosodal" />
    <meta name="twitter:description" content="Find events, join private university clubs and discover gigs. Built for students in Qatar." />

    <!-- Structured data so search engines understand what the site is. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Circosodal",
        "url": "https://callee-sooty.vercel.app/",
        "description": "Clubs, events and gigs for students in Qatar."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
